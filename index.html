<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rahav Public School - Cloud ERP & School Management System | गोरखपुर-कुशीनगर</title>
  
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  
  <!-- Google Fonts: Outfit & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Noto Sans Devanagari', 'sans-serif'],
            hindi: ['Noto Sans Devanagari', 'Outfit', 'sans-serif'],
          },
          colors: {
            school: {
              navy: '#0f172a',
              blue: '#1e3a8a',
              gold: '#f59e0b',
              amber: '#d97706',
              maroon: '#881337',
              emerald: '#059669'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles for Mobile Device Shell, Marksheets & Watermarks -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen selection:bg-indigo-500 selection:text-white">
  
  <!-- Main Single Page Root Container -->
  <div id="app-root">
    <!-- Initial Loading Fallback -->
    <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <h2 class="text-lg font-bold">Rahav Public School Cloud Suite</h2>
        <p class="text-xs text-slate-400">Loading multi-role UI environment...</p>
      </div>
    </div>
  </div>

  <!-- Application Mock Data & State Controller -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
